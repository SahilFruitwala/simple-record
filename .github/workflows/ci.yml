name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  portable:
    name: Portable tests and SRT end to end (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ffmpeg (with libsrt, libx264, libx265)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Unit tests (layouts, shapes, mic filters, shortcuts, MPEG-TS, SRT)
        run: cargo test --manifest-path portable/Cargo.toml
      - name: Install MediaMTX (a second, independent SRT implementation)
        run: |
          tag=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/bluenviron/mediamtx/releases/latest | jq -r .tag_name)
          curl -fsSL "https://github.com/bluenviron/mediamtx/releases/download/$tag/mediamtx_${tag}_linux_amd64.tar.gz" | sudo tar xz -C /usr/local/bin mediamtx
          mediamtx --version
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: SRT end to end (libsrt plain, AES-128/256, HEVC, 5% loss, wrong passphrase; MediaMTX)
        run: scripts/srt-e2e.sh

  macos:
    name: Build, clippy and tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install ffmpeg (tests check files with ffprobe)
        run: brew install ffmpeg
      - name: Build
        run: cargo build --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets
      - name: Tests
        run: cargo test --locked
      # The SRT end to end runs on Linux: Homebrew's ffmpeg has no libsrt.
