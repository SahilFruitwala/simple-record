name: CI

# Runs only for recorder/streaming code and build inputs, not docs, the landing page or workflow files.
on:
  push:
    paths:
      - "src/**"
      - "vendor/**"
      - "scripts/**"
      - "support/**"
      - "assets/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "src/**"
      - "vendor/**"
      - "scripts/**"
      - "support/**"
      - "assets/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

jobs:
  macos:
    name: Build, clippy and tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Access the private zerorec repo
        # A fine-grained token with read access to SahilFruitwala/zerorec's contents.
        run: |
          if [ -z "$ZEROREC_TOKEN" ]; then echo "::error::Set the ZEROREC_TOKEN secret (read access to SahilFruitwala/zerorec)"; exit 1; fi
          git config --global url."https://x-access-token:${ZEROREC_TOKEN}@github.com/SahilFruitwala/zerorec".insteadOf "https://github.com/SahilFruitwala/zerorec"
        env:
          ZEROREC_TOKEN: ${{ secrets.ZEROREC_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install ffmpeg (tests check files with ffprobe)
        run: brew install ffmpeg
      - name: Build
        run: cargo build --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets
      - name: Tests
        run: cargo test --locked
      - name: Scene sources end to end (video file, web page, chroma key)
        run: scripts/sources-check.sh target/debug/simple-record
      # The portable tests and SRT end to end moved to the zerorec repo with the engine.
