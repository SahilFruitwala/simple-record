name: CI

# Runs only for recorder/streaming code and build inputs, not docs, the landing page or workflow files.
on:
  push:
    paths:
      - "src/**"
      - "vendor/**"
      - "scripts/**"
      - "support/**"
      - "assets/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "src/**"
      - "vendor/**"
      - "scripts/**"
      - "support/**"
      - "assets/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

jobs:
  macos:
    name: Build, clippy and tests (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install ffmpeg (tests check files with ffprobe)
        run: brew install ffmpeg
      - name: Build
        run: cargo build --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets
      - name: Tests
        run: cargo test --locked
      - name: Scene sources end to end (video file, web page, chroma key)
        run: scripts/sources-check.sh target/debug/simple-record
      # The portable tests and SRT end to end moved to the zerorec repo with the engine.
